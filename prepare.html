<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تجهيز خريطة التضاريس</title>
<link rel="icon" href="data:,">
<style>
  body { margin:0; background:#0b1026; color:#f2efe8; font-family:Tahoma, Arial, sans-serif; }
  .box { max-width:640px; margin:60px auto; padding:24px 28px; background:#151d40; border:1px solid #2c3a6e; border-radius:16px; line-height:1.8; }
  h1 { font-size:20px; margin:0 0 8px; }
  .muted { color:#a9b3d6; font-size:13px; }
  input[type=file] { margin:14px 0; color:#f2efe8; }
  progress { width:100%; height:14px; }
  #log { font-family:Consolas, monospace; font-size:12px; direction:ltr; text-align:left; white-space:pre-wrap; color:#a9b3d6; margin-top:10px; }
  .ok { color:#8fe3b3; font-weight:bold; }
</style>
</head>
<body>
<div class="box">
  <h1>تجهيز خريطة التضاريس للموقع</h1>
  <div class="muted">اختار ملف <b>LDEM_80S_80MPP_ADJ</b> (.tif / .tiff) من جهازك. الصفحة بتصغّره لخرائط خفيفة (حوالي 11 ميجا) وبتنزّل ملف واحد اسمه <b>terrain_pack.bin</b> بمجلد التنزيلات. الحساب بيصير على جهازك وما بيترفع إشي.</div>
  <input type="file" id="file" accept=".tif,.tiff">
  <progress id="prog" value="0" max="100"></progress>
  <div id="state" class="muted"></div>
  <div id="log"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const log = (t) => { $('log').textContent += t + '\n'; console.log(t); };
const LEVELS = [['L0', 40000, 80], ['L1', 150000, 160], ['L2', 300000, 640]];

$('file').onchange = async () => {
  const f = $('file').files[0]; if (!f) return;
  $('log').textContent = ''; $('state').textContent = 'جاري القراءة…';
  try {
    const tiff = await GeoTIFF.fromBlob(f);
    const img = await tiff.getImage();
    const W = img.getWidth(), H = img.getHeight();
    const [ox, oy] = img.getOrigin(), [rx, ry] = img.getResolution();
    const nodata = img.getGDALNoData();
    const keys = img.getGeoKeys ? img.getGeoKeys() : {};
    log('size ' + W + ' x ' + H + ', origin ' + ox + ', ' + oy + ', res ' + rx + ', ' + ry + ', nodata ' + nodata);
    log('geokeys ' + JSON.stringify(keys).slice(0, 400));
    const res = Math.abs(rx); if (Math.abs(Math.abs(ry) - res) > 1e-6) throw new Error('non-square pixels');
    if (ry > 0) throw new Error('unexpected north-up orientation');

    // level grids aligned to source pixel edges so blocks are exact averages
    const levels = LEVELS.map(([name, half, r]) => {
      const f = Math.round(r / res);
      const step = f * res;
      const xmin = ox + Math.round((-half - ox) / step) * step;
      const ymax = oy - Math.round((oy - half) / step) * step;
      const n = Math.round(2 * half / step);
      return { name, res: step, factor: f, nx: n, ny: n, xmin, ymax, sum: new Float64Array(n * n), cnt: new Uint32Array(n * n) };
    });

    const isNo = (v) => !isFinite(v) || Math.abs(v) > 1e30 || (nodata !== null && Math.abs(v - nodata) <= 1e-6 * Math.max(1, Math.abs(nodata)));
    let scale = null;
    const BAND = 256;
    for (let y0 = 0; y0 < H; y0 += BAND) {
      const y1 = Math.min(H, y0 + BAND);
      const [band] = await img.readRasters({ window: [0, y0, W, y1], samples: [0] });
      if (scale === null) {
        let mx = 0; for (let k = 0; k < band.length; k += 97) { const v = band[k]; if (!isNo(v)) mx = Math.max(mx, Math.abs(v)); }
        scale = mx > 0 && mx < 30 ? 1000 : 1;
        log('height units scale x' + scale + ' (sample max ' + mx + ')');
      }
      for (let j = y0; j < y1; j++) {
        const yc = oy - (j + 0.5) * res;
        const row = (j - y0) * W;
        for (const L of levels) {
          const lj = Math.floor((L.ymax - yc) / L.res);
          if (lj < 0 || lj >= L.ny) continue;
          const i0 = Math.max(0, Math.ceil((L.xmin - ox) / res)), i1 = Math.min(W, Math.floor((L.xmin + L.nx * L.res - ox) / res));
          const base = lj * L.nx;
          for (let i = i0; i < i1; i++) {
            const v = band[row + i];
            if (isNo(v)) continue;
            const li = Math.floor((ox + (i + 0.5) * res - L.xmin) / L.res);
            if (li < 0 || li >= L.nx) continue;
            L.sum[base + li] += v; L.cnt[base + li]++;
          }
        }
      }
      $('prog').value = Math.round(100 * y1 / H);
      $('state').textContent = 'جاري الحساب… ' + Math.round(100 * y1 / H) + '%';
      await new Promise((r) => setTimeout(r, 0));
    }

    // pack: [uint32 header length][JSON header][int16 grids]
    const header = { version: 1, source: f.name, src: { width: W, height: H, origin: [ox, oy], res, nodata, geokeys: keys }, scale, levels: [] };
    const parts = []; let offset = 0;
    for (const L of levels) {
      const h = new Int16Array(L.nx * L.ny); let valid = 0, mn = 1e9, mx = -1e9;
      for (let k = 0; k < h.length; k++) {
        if (L.cnt[k]) { const v = Math.round(L.sum[k] / L.cnt[k] * scale); h[k] = Math.max(-32000, Math.min(32000, v)); valid++; mn = Math.min(mn, h[k]); mx = Math.max(mx, h[k]); }
        else h[k] = -32768;
      }
      log(L.name + ': ' + L.nx + 'x' + L.ny + ' @' + L.res + ' m, valid ' + (100 * valid / h.length).toFixed(1) + '%, h ' + mn + '..' + mx);
      header.levels.push({ name: L.name, res: L.res, nx: L.nx, ny: L.ny, xmin: L.xmin, ymax: L.ymax, offset, bytes: h.byteLength });
      parts.push(h); offset += h.byteLength;
    }
    const hj = new TextEncoder().encode(JSON.stringify(header));
    const pad = (4 - (hj.length % 4)) % 4;
    const head = new Uint8Array(4 + hj.length + pad).fill(32); new DataView(head.buffer).setUint32(0, hj.length + pad, true); head.set(hj, 4);
    const blob = new Blob([head, ...parts], { type: 'application/octet-stream' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'terrain_pack.bin'; document.body.appendChild(a); a.click();
    $('state').innerHTML = '<span class="ok">خلص ✓ نزل ملف terrain_pack.bin (' + (blob.size / 1e6).toFixed(1) + ' ميجا) بمجلد التنزيلات.</span> احكي لClaude.';
  } catch (e) {
    console.error(e); $('state').textContent = 'صار خطأ: ' + e.message; log(String(e && e.stack || e));
  }
};
</script>
</body>
</html>
